# Dev Container Docker Compose
# Customize the app service for your stack (Node.js, Python, Go, etc.)

services:
  app:
    # --- Uncomment your stack ---

    # Node.js / TypeScript
    image: mcr.microsoft.com/devcontainers/typescript-node:22

    # Python
    # image: mcr.microsoft.com/devcontainers/python:3.13

    # Go
    # image: mcr.microsoft.com/devcontainers/go:1.22

    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - db
      # - redis

  db:
    # Same image as CI (.github/workflows/ci.yml) so local dev and CI agree on
    # both the Postgres major and the available extensions. Canonical value:
    # prd/00_technology.md "Containerization".
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

volumes:
  postgres_data:
