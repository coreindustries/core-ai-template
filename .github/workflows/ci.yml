name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache
  # npm's defaults (2 retries, 60s ceiling) turn ordinary registry blips into
  # red builds. Set once here so every job that shells out to npm inherits them
  # — harmless for Python-only projects, already correct once the template grows
  # a Node toolchain.
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Lint - Code quality checks
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Every job sets an explicit timeout: without one, a runner that wedges
    # (commonly inside actions/checkout) holds a required check for GitHub's
    # 6-hour default and silently blocks merges. Set each to roughly 2x the
    # longest green duration you observe, then revisit if it starts tripping.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Unconditional: agent model pins concern .claude/, not the Python
      # toolchain, so this runs even on an uninitialized template. Catches
      # frontmatter hand-edited away from .claude/agent-models.json — that
      # drift is silent otherwise, and an agent meant for opus quietly
      # downgrades to sonnet.
      - name: Check agent model pins match agent-models.json
        run: node scripts/sync-agent-models.mjs --check

      - name: Check project initialized
        id: init
        run: |
          if [ -f pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pyproject.toml found — template not yet initialized. Skipping CI steps."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.init.outputs.ready == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        if: steps.init.outputs.ready == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.init.outputs.ready == 'true'
        run: uv sync --frozen --extra dev

      - name: Run Ruff linter
        if: steps.init.outputs.ready == 'true'
        run: uv run ruff check src/ tests/

      - name: Run Ruff formatter check
        if: steps.init.outputs.ready == 'true'
        run: uv run ruff format --check src/ tests/

  # ===========================================================================
  # Type Check - Static type analysis
  # ===========================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check project initialized
        id: init
        run: |
          if [ -f pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pyproject.toml found — template not yet initialized. Skipping CI steps."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.init.outputs.ready == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        if: steps.init.outputs.ready == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.init.outputs.ready == 'true'
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        if: steps.init.outputs.ready == 'true'
        run: uv run prisma generate

      - name: Run mypy
        if: steps.init.outputs.ready == 'true'
        run: uv run mypy src/

  # ===========================================================================
  # Test - Unit and integration tests
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db  # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check project initialized
        id: init
        run: |
          if [ -f pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pyproject.toml found — template not yet initialized. Skipping CI steps."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.init.outputs.ready == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        if: steps.init.outputs.ready == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.init.outputs.ready == 'true'
        run: uv sync --frozen --extra dev

      - name: Generate Prisma client
        if: steps.init.outputs.ready == 'true'
        run: uv run prisma generate

      - name: Setup database schema
        if: steps.init.outputs.ready == 'true'
        run: uv run prisma db push --skip-generate --accept-data-loss

      - name: Run tests with coverage
        if: steps.init.outputs.ready == 'true'
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=66

      - name: Upload coverage to Codecov
        if: steps.init.outputs.ready == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # Security - Security scanning
  # ===========================================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # Full history for secret scanning
          persist-credentials: false

      - name: Check project initialized
        id: init
        run: |
          if [ -f pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No pyproject.toml found — template not yet initialized. Skipping Python security steps."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.init.outputs.ready == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.7.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        if: steps.init.outputs.ready == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.init.outputs.ready == 'true'
        run: uv sync --frozen --extra dev

      - name: Run Bandit security check
        if: steps.init.outputs.ready == 'true'
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Run pip-audit
        if: steps.init.outputs.ready == 'true'
        run: uv run pip-audit --desc

      - name: Enforce 24h dependency cooldown
        run: bash scripts/assert-dependency-age.sh
        env:
          BASE_REF: origin/${{ github.base_ref || github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Gitleaks (secret and PII scanning)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ===========================================================================
  # Build - Docker image build test
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check project initialized
        id: init
        run: |
          if [ -f Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Dockerfile found — template not yet initialized. Skipping build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.init.outputs.ready == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        if: steps.init.outputs.ready == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: false
          target: production
          tags: app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
