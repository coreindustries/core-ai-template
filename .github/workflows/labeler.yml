name: PR Labeler

# Auto-applies area/* labels to PRs based on changed file paths.
# Configuration lives in .github/labeler.yml.
#
# Security notes:
# - actions/labeler reads .github/labeler.yml from the BASE branch (not the
#   PR head), so a fork PR cannot inject a malicious labeler config.
# - No user-controlled input is interpolated into shell commands.
# - The third-party action is pinned to a commit SHA.
#
# Authors still apply type (bug / feature / docs / chore / security /
# breaking) and priority labels manually — those describe intent, not
# file paths.

# pull_request_target is required so the action can write labels to PRs from
# forks (fork PRs lack write access under the pull_request event). Safe here
# because: (1) actions/labeler reads labeler.yml from the BASE branch only —
# a fork PR cannot inject a malicious config; (2) no user-controlled input
# is interpolated into shell commands; (3) no PR-head code is checked out or
# executed; (4) permissions are narrowed to pull-requests:write, contents:read.
# zizmor: ignore[dangerous-triggers]
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
