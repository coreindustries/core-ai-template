name: Auto-Merge Policy
# Classifies PRs by commit type prefix and enables GitHub native
# auto-merge for Tier 0 (chore/docs/style) and Tier 1 (fix) PRs
# once all required status checks pass.
#
# Tier 0 — Auto-merge immediately when CI passes
# Tier 1 — Auto-merge after 30-minute review window
# Tier 2 — Requires Core review (feat or unknown prefix)
# Tier 3 — Hold (PRs with auth/billing/db/infra area labels, or touching prd/)
#
# Classification itself lives in scripts/dev/board/classify-pr-tier.sh (not
# inline YAML) so it can be unit-tested against a fake `gh`
# (scripts/dev/board/tests/classify-pr-tier.test.sh) rather than only
# exercised by a live PR.
#
# Concurrency: one run per PR, cancelling any run still sleeping through the
# Tier-1 review window — a later push that reclassifies the PR (e.g. adds a
# prd/ file, making it Tier 3) must not let a stale Tier-1 run enable
# auto-merge out from under the new classification.
#
# Prerequisites: "Allow auto-merge" must be enabled in repo Settings → General.
# Branch protection must require status checks to pass before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tier-check:
    name: Classify PR tier and configure merge
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Required by classify-pr-tier.sh and every other `gh` call below: this
      # job runs with only a BASE-commit checkout (see the anti-tamper step),
      # never one of the PR's own head content, so `gh` cannot infer the
      # repo from a git remote and needs this explicitly.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      # The BASE commit, not the PR head: a PR must not be able to edit
      # classify-pr-tier.sh to make itself pass (same anti-tamper pattern as
      # branch-name-lint.yml / doc-id-lint.yml). No credentials are needed
      # here — `gh` authenticates separately via GH_TOKEN above, and this
      # step only reads files, never pushes.
      #
      # Limit: under `pull_request`, THIS workflow file is read from the PR's
      # merge ref, so a same-repo PR can edit auto-merge.yml itself to skip
      # the classifier. The base checkout protects the script, not the YAML.
      # Put `.github/workflows/**` under CODEOWNERS / required review to
      # close that.
      - name: Checkout base commit (anti-tamper)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Classify PR tier
        id: tier
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -uo pipefail
          # Absent only on the base commit of the PR that introduces the
          # script itself. Fails CLOSED (tier 3) rather than skipping: there
          # is no safe default tier for "we could not classify this PR".
          if [ ! -x scripts/dev/board/classify-pr-tier.sh ]; then
            echo "::warning title=Auto-merge classifier skipped::scripts/dev/board/classify-pr-tier.sh is not on the base commit yet — defaulting to tier 3 (needs-review)"
            echo "tier=3" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `|| rc=$?`: the step shell is `bash -e`, which would abort on a
          # non-zero `$(...)` before a bare `rc=$?` ran, skipping the
          # fail-closed branch below.
          rc=0
          OUT="$(scripts/dev/board/classify-pr-tier.sh "$PR_NUMBER")" || rc=$?
          if [ "$rc" -ne 0 ] || ! printf '%s' "$OUT" | grep -qE '^tier=[0-3]$'; then
            echo "::warning title=Auto-merge classifier failed::classify-pr-tier.sh exited ${rc} with output [${OUT}] — defaulting to tier 3 (needs-review)"
            OUT="tier=3"
          fi
          echo "$OUT" >> "$GITHUB_OUTPUT"

      - name: Apply tier label
        env:
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          case "$TIER" in
            0) LABEL="auto-merge-tier-0" ;;
            1) LABEL="auto-merge-tier-1" ;;
            *) LABEL="needs-review" ;;
          esac
          # A reclassified PR must not keep its old tier label.
          for other in auto-merge-tier-0 auto-merge-tier-1 needs-review; do
            [ "$other" = "$LABEL" ] || gh pr edit "$PR_NUMBER" --remove-label "$other" >/dev/null 2>&1 || true
          done
          gh pr edit "$PR_NUMBER" --add-label "$LABEL" || true

      - name: Disable auto-merge — Tier 2/3 (revoke anything enabled by an earlier, looser classification)
        if: steps.tier.outputs.tier == '2' || steps.tier.outputs.tier == '3'
        run: |
          # A PR can start Tier 0/1 (auto-merge enabled) and then have a
          # later push make it Tier 2/3 (a feat, a prd/ file, a protected-area
          # label). Revoke so a stale auto-merge can't complete behind
          # review's back. Read the actual state first rather than matching
          # gh's error text: nothing to do if auto-merge is off, and a failed
          # revoke (or a failed state read) must fail the step loudly.
          state="$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" || {
            echo "::error title=Could not read auto-merge state::PR #${PR_NUMBER}"; exit 1; }
          if [ "$state" = "true" ]; then
            gh pr merge "$PR_NUMBER" --disable-auto || {
              echo "::error title=Could not revoke auto-merge::PR #${PR_NUMBER} still has auto-merge enabled"; exit 1; }
          fi

      - name: Enable auto-merge — Tier 0 (immediate)
        if: steps.tier.outputs.tier == '0'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit: if a push lands between classification and
        # this call, GitHub refuses rather than auto-merging an unclassified head.
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$EXPECTED_HEAD_SHA"

      - name: Enable auto-merge — Tier 1 (30-minute window)
        if: steps.tier.outputs.tier == '1'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # NOTE: sleep holds a runner for 30 minutes. Replace with a
          # dedicated delay action before using in high-volume repos.
          echo "Waiting 30-minute review window before enabling auto-merge..."
          sleep 1800
          # Belt-and-suspenders alongside the workflow-level concurrency
          # group above: if this run somehow wasn't cancelled by a later
          # push (e.g. a scheduling race), re-check the head SHA before
          # enabling auto-merge rather than trusting a 30-minute-stale
          # classification. A changed head means a fresh run already fired
          # for the new commit and will make its own tier decision.
          CURRENT_HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          if [ "$CURRENT_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::notice title=Auto-merge Tier 1 skipped::PR #${PR_NUMBER} head moved from ${EXPECTED_HEAD_SHA} to ${CURRENT_HEAD_SHA} during the review window — a newer run already reclassified it; not enabling auto-merge here."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$EXPECTED_HEAD_SHA"

      - name: Notify Slack — auto-merge enabled
        if: steps.tier.outputs.tier == '0' || steps.tier.outputs.tier == '1'
        env:
          # Unset in this template, so send-hook.js skips and the step passes.
          # Downstream: create this secret to start receiving these. See REPO_SETUP.md.
          SLACK_WEBHOOK_CI_ALERTS: ${{ secrets.SLACK_WEBHOOK_CI_ALERTS }}
          TIER: ${{ steps.tier.outputs.tier }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          SUFFIX=""
          [ "$TIER" = "1" ] && SUFFIX=" (30min review window)"
          node tools/comms/send-hook.js \
            --to ci-alerts --from ci \
            --message "🤖 Auto-merge enabled${SUFFIX} — PR #${PR_NUMBER}: ${PR_TITLE} (Tier ${TIER})"
