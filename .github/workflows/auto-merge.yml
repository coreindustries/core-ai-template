name: Auto-Merge Policy
# Classifies PRs by commit type prefix and enables GitHub native
# auto-merge for Tier 0 (chore/docs/style) and Tier 1 (fix) PRs
# once all required status checks pass.
#
# Tier 0 — Auto-merge immediately when CI passes
# Tier 1 — Auto-merge after 30-minute review window
# Tier 2 — Requires Core review (feat or unknown prefix)
# Tier 3 — Hold (PRs with auth/billing/db/infra area labels)
#
# Prerequisites: "Allow auto-merge" must be enabled in repo Settings → General.
# Branch protection must require status checks to pass before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  tier-check:
    name: Classify PR tier and configure merge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Classify PR tier
        id: tier
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TITLE="$PR_TITLE"

          # prd/ is sensitive for a different reason than the area labels
          # below: a "grooming-only" PRD PR can still change scope under the
          # hood — flipping a PRD's frontmatter `status` to
          # Superseded/Deprecated hides its FRs from `board.sh prd-scan`
          # (which skips deprecated/superseded/dropped/cancelled PRDs), and
          # adding FR ids to a previously-unnumbered PRD creates real
          # FEATURES-lane work. The prd-manager skill's own commit-prefix
          # convention (📝 docs(prd): vs ✨ feat(prd):) is a hint for
          # reviewers, not a merge-path decision, so this reads the actual
          # changed files rather than trusting the prefix — and it can't
          # depend on the labeler workflow's area/agent label either: that
          # workflow races this one on the same PR events (both trigger on
          # opened/synchronize/reopened) and area/agent covers more than just
          # prd/ anyway (`.claude/**`, `docs/decisions/**`, ...).
          # PRD_SENSITIVE_PATTERN mirrors the PRD root directory in
          # `.claude/agent-lanes.json`'s `prd.glob` — hardcoded here because
          # this step has no jq/config reader available; keep the two in
          # sync if the PRD directory ever moves. Pinned by
          # scripts/dev/board/tests/auto-merge-sensitive-paths.test.sh, which
          # reads this exact line out of this file.
          PRD_SENSITIVE_PATTERN='^prd/'
          CHANGED_FILES="$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')"

          if printf '%s\n' "$CHANGED_FILES" | grep -qE "$PRD_SENSITIVE_PATTERN"; then
            echo "tier=3" >> "$GITHUB_OUTPUT"

          # Tier 3: protected areas set by labeler.yml
          elif echo "$LABELS" | grep -qE '"area/(auth|billing|database|infra)"'; then
            echo "tier=3" >> "$GITHUB_OUTPUT"

          # Tier 0: chore, docs, style (with or without gitmoji prefix)
          elif echo "$TITLE" | grep -qiE '^(🔧 chore|📝 docs|🎨 style|chore|docs|style):'; then
            echo "tier=0" >> "$GITHUB_OUTPUT"

          # Tier 1: fix (with or without gitmoji prefix)
          elif echo "$TITLE" | grep -qiE '^(🐛 fix|fix):'; then
            echo "tier=1" >> "$GITHUB_OUTPUT"

          # Tier 2: feat or anything else
          else
            echo "tier=2" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply tier label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          case "$TIER" in
            0) LABEL="auto-merge-tier-0" ;;
            1) LABEL="auto-merge-tier-1" ;;
            *) LABEL="needs-review" ;;
          esac
          gh pr edit "$PR_NUMBER" --add-label "$LABEL" || true

      - name: Enable auto-merge — Tier 0 (immediate)
        if: steps.tier.outputs.tier == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash

      - name: Enable auto-merge — Tier 1 (30-minute window)
        if: steps.tier.outputs.tier == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # NOTE: sleep holds a runner for 30 minutes. Replace with a
          # dedicated delay action before using in high-volume repos.
          echo "Waiting 30-minute review window before enabling auto-merge..."
          sleep 1800
          gh pr merge "$PR_NUMBER" --auto --squash

      - name: Notify Slack — auto-merge enabled
        if: steps.tier.outputs.tier == '0' || steps.tier.outputs.tier == '1'
        env:
          # Unset in this template, so send-hook.js skips and the step passes.
          # Downstream: create this secret to start receiving these. See REPO_SETUP.md.
          SLACK_WEBHOOK_CI_ALERTS: ${{ secrets.SLACK_WEBHOOK_CI_ALERTS }}
          TIER: ${{ steps.tier.outputs.tier }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          SUFFIX=""
          [ "$TIER" = "1" ] && SUFFIX=" (30min review window)"
          node tools/comms/send-hook.js \
            --to ci-alerts --from ci \
            --message "🤖 Auto-merge enabled${SUFFIX} — PR #${PR_NUMBER}: ${PR_TITLE} (Tier ${TIER})"
