name: Sync labels

# Reconciles the repo's labels with .github/labels.yml. Triggered on
# changes to the config or via manual dispatch.
#
# Security notes:
# - No user-controlled input is interpolated into shell commands.
# - Third-party actions are pinned to commit SHAs.
# - delete-other-labels is false: ad-hoc labels added by maintainers
#   are preserved.

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
