# Agent lanes — tests for the board tooling (scripts/dev/board/) and the lane
# hooks. All tests run against fake gh/curl binaries: no network, no token.

name: Agent lanes

on:
  push:
    branches: [main]
    paths:
      - scripts/dev/board/**
      - scripts/assert-branch-name.sh
      - scripts/assert-doc-ids.sh
      - scripts/pr-delivery-contract-check.sh
      - .claude/hooks/**
      - .claude/agent-lanes.json
      - .github/labels.yml
      - .github/workflows/agent-lanes.yml
  pull_request:
    paths:
      - scripts/dev/board/**
      - scripts/assert-branch-name.sh
      - scripts/assert-doc-ids.sh
      - scripts/pr-delivery-contract-check.sh
      - .claude/hooks/**
      - .claude/agent-lanes.json
      - .github/labels.yml
      - .github/workflows/agent-lanes.yml

permissions:
  contents: read

jobs:
  test:
    name: Board tools + hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate lane config
        run: scripts/dev/board/lanes-config.sh check

      - name: Run tests
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: scripts/dev/board/tests/run-all.sh
