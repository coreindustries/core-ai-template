name: Branch Name Lint

# Requires branches to be namespaced (`<type>/<slug>`) rather than bare.
#
# This matters most for parallel agent work: when two agents independently pick
# up "fix the login bug", bare names like `fix-login` collide, while
# `fix/login-null-session` and `fix/login-timeout` do not. The Makefile's
# `make wt name=<branch>` target produces conforming names.
#
# Security note: the branch name is attacker-controllable on a fork PR, so it is
# passed through `env:` and quoted rather than interpolated into the shell.

on:
  pull_request:

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The base commit, not the PR head: a PR must not be able to edit the
      # lint script to pass itself.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # One regex, shared with `make pr-check`: scripts/assert-branch-name.sh
      - name: Validate branch name is namespaced
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Absent only on the base of the PR that introduces the script;
          # say so rather than misreport the branch as bare.
          if [ ! -x scripts/assert-branch-name.sh ]; then
            echo "::warning title=Branch lint skipped::scripts/assert-branch-name.sh is not on the base commit yet — branch not checked"
            exit 0
          fi
          if ! scripts/assert-branch-name.sh "$BRANCH"; then
            echo "::error title=Bare branch name::'$BRANCH' is not namespaced."
            exit 1
          fi
