name: PR Size Nudge
# Advisory only: labels a PR `large-pr` and comments once when it changes more
# than PR_SIZE_THRESHOLD lines (lockfiles excluded), asking for a split or a
# one-line rationale. It never fails a check and is not a required status.
# Runs only for same-repo PRs: fork PRs get a read-only token, so they are
# skipped rather than failed. No code is checked out and no PR text is used.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  size:
    name: Flag large PRs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SIZE_THRESHOLD: "800"
    steps:
      - name: Count changed lines and nudge
        run: |
          set -euo pipefail
          changed="$(gh pr view "$PR_NUMBER" --json files \
            --jq '[.files[] | select(.path | test("(^|/)(package-lock\\.json|pnpm-lock\\.yaml|yarn\\.lock|uv\\.lock|poetry\\.lock|Cargo\\.lock|go\\.sum|bun\\.lock)$") | not) | .additions + .deletions] | add // 0')"
          echo "changed lines (lockfiles excluded): $changed (threshold $PR_SIZE_THRESHOLD)"
          marker='<!-- pr-size-nudge -->'
          # REST, not `gh pr edit`: that command also queries classic projects,
          # which the default workflow token cannot read.
          has_label="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | index("large-pr") != null')"
          if [ "$changed" -le "$PR_SIZE_THRESHOLD" ]; then
            if [ "$has_label" = "true" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/large-pr" >/dev/null
            fi
            exit 0
          fi
          if [ "$has_label" != "true" ]; then
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f "labels[]=large-pr" >/dev/null
          fi
          if ! gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$PR_NUMBER" --body "$marker
          This PR changes **$changed** lines (threshold $PR_SIZE_THRESHOLD, lockfiles excluded). Large changes are harder to review and more likely to hide unneeded code. Consider splitting it, or add a one-line rationale to the PR body for why it must land together. This is advisory and blocks nothing."
          fi
