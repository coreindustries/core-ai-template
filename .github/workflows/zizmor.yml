name: Zizmor

# Static analysis gate for GitHub Actions workflow files.
# Runs on every PR that touches .github/workflows/** and blocks merge
# on any finding at --min-severity low.
#
# This is the regression gate for ADR-0005 (CI/CD supply chain hardening).
# Do not disable or raise the severity threshold without updating the ADR.
#
# Security notes:
# - No user-controlled input is interpolated into shell commands.
# - Third-party action is pinned to a commit SHA.

on:
  pull_request:
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor workflow analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hash-pinned so a compromised or re-uploaded PyPI artifact cannot change
      # what the security gate itself runs. All Linux + macOS wheels for the
      # version are listed so this resolves on x86_64, arm64, glibc and musl
      # runners (and locally) without a second requirements file. Bumping the
      # version means replacing every hash — fetch them from
      # https://pypi.org/pypi/zizmor/<version>/json
      - name: Install Zizmor
        run: |
          cat > "${RUNNER_TEMP}/zizmor-requirements.txt" <<'EOF'
          zizmor==1.30.1 \
            --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e \
            --hash=sha256:92906f448365672ebb657fb50d36f997290a3aaba8cac723214741ea9054845d \
            --hash=sha256:4a5ef2fa4fbd2984f794cfc2f95790bd03fa0bae801487ed550e044675874e60 \
            --hash=sha256:15679642e8c4f825ba3f22537c698b1bbbad19ead23640f62ec45ebbe7abc803 \
            --hash=sha256:17fda74e15fe41a6aa354ea4cf71fc7ff3cd025cda6584bb6d7466b3f1d00fe6 \
            --hash=sha256:f9eb092f089e35fa9fb3b70aeec0a19eca7dacf2ab161f1d50b18351895f085c
          EOF
          pip install --no-deps --require-hashes -r "${RUNNER_TEMP}/zizmor-requirements.txt"

      - name: Run Zizmor
        run: zizmor --min-severity low --persona regular .github/workflows/
