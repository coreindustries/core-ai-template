# Dependabot — Automated Dependency Updates
# https://docs.github.com/en/code-security/dependabot
#
# Policy: all direct deps pinned (no ranges), all transitive deps locked,
# every bump respects a 24h cooldown (supply-chain zero-day window).
# See .claude/rules/dependency-security.md.
#
# Uncomment ecosystems that match your project's tech stack.

version: 2

# =============================================================================
# Cooldown — minimum age before a version is eligible for a Dependabot PR.
# Applies to ALL ecosystems below unless a given update overrides it.
# =============================================================================
# Default: 1 day (= 24h). Major bumps get 7 days to let the ecosystem settle.
# Security advisories bypass this (Dependabot security updates ignore cooldown).

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions — pin to commit SHA. Dependabot bumps the SHA and comment.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 1
      semver-major-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

